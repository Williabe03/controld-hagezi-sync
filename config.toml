[settings]
# Keep this true for the first workflow run to validate the imports.
dry_run = false

[profiles]
names = ["HageziLists"]

[folders]
"HaGeZi Referral Allow" = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/controld/referral-allow-folder.json"
"HaGeZi Spam TLDs" = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/controld/spam-tlds-combined-folder.json"
"HaGeZi Badware Hoster" = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/controld/badware-hoster-folder.json"
"HaGeZi Apple Private Relay Allow" = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/controld/apple-private-relay-allow-folder.json"

[profile_folders]
"HageziLists" = [
  "HaGeZi Referral Allow",
  "HaGeZi Spam TLDs",
  "HaGeZi Badware Hoster",
  "HaGeZi Apple Private Relay Allow"
]
